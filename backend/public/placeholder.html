<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>茶芽芽商城 · 正在加载</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
         background:#f2f7f3;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:#2c3e36}
    .box{text-align:center}
    .dot{width:12px;height:12px;border-radius:50%;background:#5aa06e;display:inline-block;margin:0 4px;
         animation:b 1s infinite ease-in-out}
    .dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}
    @keyframes b{0%,80%,100%{transform:scale(.6);opacity:.5}40%{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
  <div class="box">
    <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    <p>茶芽芽商城前端资源正在加载…</p>
    <p style="font-size:13px;color:#7c8a83">若长时间停留在此页，请确认 frontend/ 已构建到 public/ 目录</p>
  </div>
</body>
</html>
