<!DOCTYPE html>

<head>

<title>茶芽芽 · 改动预览目录</title>
<style>
  body { margin: 0; background: #eef2ee; color: #23302b; font-family: "PingFang SC","Microsoft YaHei",sans-serif; line-height: 1.7; }

  a.item { display: block; background: #fff; border-radius: 14px; padding: 16px 18px; margin-bottom: 12px;
           text-decoration: none; color: inherit; box-shadow: 0 2px 14px rgba(24,58,42,.07); }
  a.item:hover { box-shadow: 0 6px 22px rgba(24,58,42,.13); }
  .t { font-size: 16px; font-weight: 700; color: #2e6b4f; }
  .d { font-size: 13px; color: #4d5b54; margin-top: 4px; }
  .badge { display: inline-block; background: #fff8e6; color: #b7791f; font-size: 11.5px;
           padding: 1px 8px; border-radius: 999px; margin-left: 6px; vertical-align: middle; }

</style>

<body>
<div class="wrap">
  <h1>🌱 改动预览</h1>
  <div class="sub">这里是对照预览，<b>不影响线上页面</b>。看完告诉我要改哪里，我再动线上。</div>

  <a class="item" href="/溯源结果页-新版设计预览.html">
    <div class="t">① 溯源结果页 · 新版界面 <span class="badge">重点</span></div>
    <div class="d">模仿食品数字标签平台：绿色头部 + 商品身份卡 + 三个一级标签（商品信息 / 农户信息 / 产链信息），点标签直接切换界面</div>
  </a>

  <a class="item" href="/商品卡数字调整-预览.html">
    <div class="t">② 商品卡：已售 → 预售，数字改小</div>
    <div class="d">左右对比展示改前/改后，并列出每个商品的具体数字与首页统计</div>
  </a>

  <div class="note">
    手机预览：让手机和电脑连同一个 WiFi，把地址里的 127.0.0.1 换成电脑的局域网 IP 即可。
  </div>
</div>
